<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradIcon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C430;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4900A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A5C06;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="120" height="120" rx="22" fill="#0A0600"/>

  <!-- Outer border -->
  <rect x="4" y="4" width="112" height="112" rx="18" fill="none" stroke="#4A3505" stroke-width="1.5"/>
  <rect x="8" y="8" width="104" height="104" rx="16" fill="none" stroke="#D4900A" stroke-width="1"/>

  <!-- Corner ornaments -->
  <text x="11" y="21" font-family="Arial" font-size="9" fill="#4A3505">&#x25C6;</text>
  <text x="99" y="21" font-family="Arial" font-size="9" fill="#4A3505">&#x25C6;</text>
  <text x="11" y="113" font-family="Arial" font-size="9" fill="#4A3505">&#x25C6;</text>
  <text x="99" y="113" font-family="Arial" font-size="9" fill="#4A3505">&#x25C6;</text>

  <!-- Star above FS -->
  <text x="60" y="37" font-family="Arial" font-size="14" fill="url(#goldGradIcon)" text-anchor="middle">&#x2605;</text>

  <!-- FS monogram -->
  <text
    x="60"
    y="85"
    font-family="Arial Black, Impact, Arial, sans-serif"
    font-weight="900"
    font-size="52"
    fill="url(#goldGradIcon)"
    text-anchor="middle"
    letter-spacing="-3"
  >FS</text>

  <!-- Bottom line -->
  <line x1="20" y1="96" x2="100" y2="96" stroke="#4A3505" stroke-width="1"/>
  <text x="60" y="108" font-family="Arial, sans-serif" font-size="7" fill="#7A5C1E" text-anchor="middle" letter-spacing="3">1977</text>
</svg>
