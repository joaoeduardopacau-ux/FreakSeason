<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded square background -->
  <rect width="120" height="120" rx="24" fill="#E8531A"/>

  <!-- White FS letters -->
  <text x="60" y="78" font-family="Arial Black, Arial, sans-serif"
    font-size="52" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-3">FS</text>

  <!-- Subtle glow overlay -->
  <rect width="120" height="120" rx="24" fill="url(#g)" opacity="0.15"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
</svg>
