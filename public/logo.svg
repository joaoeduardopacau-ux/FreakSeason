<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F5C430;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4900A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8A5C06;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0E0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C8B880;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Badge background (oval) -->
  <ellipse cx="56" cy="60" rx="50" ry="52" fill="#0A0600"/>
  <ellipse cx="56" cy="60" rx="50" ry="52" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <ellipse cx="56" cy="60" rx="44" ry="46" fill="none" stroke="#4A3505" stroke-width="1"/>

  <!-- Stars in badge -->
  <text x="56" y="24" font-family="Arial, sans-serif" font-size="8" fill="#D4900A" text-anchor="middle" letter-spacing="6">&#x2605; &#x2605; &#x2605;</text>

  <!-- FS monogram -->
  <text x="56" y="72" font-family="Arial Black, Impact, Arial, sans-serif" font-weight="900" font-size="36" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2">FS</text>

  <!-- Bottom of badge -->
  <text x="56" y="100" font-family="Arial, sans-serif" font-size="6.5" fill="#7A5C1E" text-anchor="middle" letter-spacing="2.5">1977</text>

  <!-- FREAK text -->
  <text
    x="120"
    y="58"
    font-family="Arial Black, Impact, Arial, sans-serif"
    font-weight="900"
    font-size="44"
    fill="url(#creamGrad)"
    letter-spacing="-1"
  >FREAK</text>

  <!-- SEASON text -->
  <text
    x="120"
    y="100"
    font-family="Arial Black, Impact, Arial, sans-serif"
    font-weight="900"
    font-size="42"
    fill="url(#goldGrad)"
    letter-spacing="-1"
  >SEASON</text>

  <!-- Tagline -->
  <text
    x="122"
    y="115"
    font-family="Arial, sans-serif"
    font-weight="400"
    font-size="7.5"
    fill="#7A5C1E"
    letter-spacing="2.5"
  >EST. VENICE BEACH &#xB7; 1977</text>
</svg>
